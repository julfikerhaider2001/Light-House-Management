# Quality gates G1–G6. Runs on every pull request, and on every push to main
# through deploy.yml (which calls this workflow and deploys only if all gates pass).
name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22
  GITLEAKS_VERSION: 8.30.1
  # Containers the DB gate does not need; G5 keeps realtime.
  SUPABASE_EXCLUDE: studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

jobs:
  static:
    name: G1 Static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint (0 warnings)
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Gitleaks secret scan
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --redact --verbose --exit-code 1 .
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  unit:
    name: G2 Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest (≥95% coverage on src/lib/calc)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  database:
    name: G3 Database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x "$SUPABASE_EXCLUDE,realtime"
      - name: Apply every migration from zero
        run: npx supabase db reset
      - name: Lint schema (errors fail)
        run: npx supabase db lint --local --level error --fail-on error
      - name: pgTAP tests
        run: npx supabase test db
      - name: Generated types match src/types/database.ts
        run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.ts
          npx prettier --stdin-filepath src/types/database.ts < /tmp/database.ts > /tmp/database.formatted.ts
          mkdir -p drift && cp /tmp/database.formatted.ts drift/database.ts
          if ! diff -u src/types/database.ts drift/database.ts; then
            echo "::error file=src/types/database.ts::Types drifted from the schema. Run 'npm run gen:types' (or take the 'types-drift' artifact) and commit."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: types-drift
          path: drift/
          retention-days: 7

  build:
    name: G4 Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vite build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
      - name: version.json carries the commit
        run: |
          cat dist/version.json
          test "$(node -p "require('./dist/version.json').version")" = "${GITHUB_SHA::7}"
      - name: Initial-route JS ≤ 250 KB gzip
        run: npm run budget

  e2e:
    name: G5 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x "$SUPABASE_EXCLUDE"
      - name: Point the build at local Supabase
        run: |
          npx supabase status -o env > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          echo "::add-mask::$KEY"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright (desktop + mobile)
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: G6 Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lighthouse CI (perf ≥85, a11y ≥95, best-practices ≥90)
        run: |
          export CHROME_PATH="$(node -p "require('@playwright/test').chromium.executablePath()")"
          npx --yes @lhci/cli@0.15.1 autorun
      - name: PWA installable
        run: |
          npm run preview > /tmp/preview.log 2>&1 &
          npx --yes wait-on@8 -t 30000 http://localhost:4173/Light-House-Management/
          npm run installable
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
