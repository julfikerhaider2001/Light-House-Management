<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light House · Meals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050807}
a{color:#22E07A}a:hover{color:#5BF09E}
.g{background:rgba(255,255,255,0.04);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,0.08);box-shadow:inset 0 1px 0 rgba(255,255,255,0.10)}
.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s cubic-bezier(.2,.8,.2,1)}
button:active{transform:scale(0.94)}
button:focus-visible,a:focus-visible{outline:2px solid #22E07A;outline-offset:2px}
.grid td,.grid th{border-bottom:1px solid rgba(255,255,255,0.05)}
@media (prefers-reduced-transparency:reduce){.g{background:#0E1411;-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){.g{background:#0E1411;border-color:rgba(255,255,255,0.4)}}
@media (prefers-reduced-motion:reduce){button,button:active{transition:none;transform:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #E8F0EC; background: radial-gradient(120% 45% at 50% -8%, rgba(34,224,122,0.11), rgba(34,224,122,0) 62%), #050807">
<main style="display: flex; flex-direction: column; gap: 14px; padding: 22px 16px 0">

<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 4px 4px 2px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="m" style="font-size: 11px; letter-spacing: 0.14em; color: #8A9A92">MEAL COUNT</span>
<h1 style="margin: 0; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; font-weight: 650">Meals</h1>
</div>
<button class="g m" aria-label="Change month, October 2026" style="height: 44px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px">Oct 2026
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
</header>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div class="g" style="border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<span class="m" style="font-size: 10px; letter-spacing: 0.1em; color: #8A9A92">TOTAL MEALS</span>
<span class="m" style="font-size: 17px; font-weight: 600">103.5</span>
</div>
<div class="g" style="border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<span class="m" style="font-size: 10px; letter-spacing: 0.1em; color: #8A9A92">MEAL RATE</span>
<span class="m" style="font-size: 17px; font-weight: 600">৳92.53</span>
</div>
<div class="g" style="border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<span class="m" style="font-size: 10px; letter-spacing: 0.1em; color: #8A9A92">KHALA DAYS</span>
<span class="m" style="font-size: 17px; font-weight: 600">24</span>
</div>
</div>

<section class="g" style="border-radius: 18px; overflow: hidden">
<div style="overflow-x: auto">
<table class="grid m" style="border-collapse: separate; border-spacing: 0; font-size: 14px; min-width: 100%">
<caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">October 2026 meals by date and member</caption>
<thead>
<tr>
<th scope="col" style="position: sticky; left: 0; z-index: 2; background: #0B100E; text-align: left; padding: 12px 10px 10px 14px; font-size: 10px; letter-spacing: 0.1em; font-weight: 500; color: #8A9A92; min-width: 64px">DATE</th>
<sc-for list="{{members}}" as="n" hint-placeholder-count="4">
<th scope="col" style="padding: 12px 8px 10px; min-width: 56px; text-align: right; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; color: {{n.color}}">{{n.name}}</th>
</sc-for>
<th scope="col" style="padding: 12px 14px 10px 8px; min-width: 52px; text-align: right; font-size: 10px; letter-spacing: 0.1em; font-weight: 500; color: #8A9A92">DAY</th>
</tr>
<tr style="background: rgba(34,224,122,0.06)">
<th scope="row" style="position: sticky; left: 0; z-index: 2; background: #0C1612; text-align: left; padding: 10px 10px 10px 14px; font-size: 12px; font-weight: 600; color: #22E07A">Σ Oct</th>
<sc-for list="{{totals}}" as="t" hint-placeholder-count="4">
<td style="padding: 10px 8px; text-align: right; font-weight: 600">{{t}}</td>
</sc-for>
<td style="padding: 10px 14px 10px 8px; text-align: right; font-weight: 600; color: #22E07A">103.5</td>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
<tr>
<th scope="row" style="position: sticky; left: 0; z-index: 1; background: #090D0B; text-align: left; padding: 9px 10px 9px 14px; font-weight: 400; white-space: nowrap">
<span style="color: #E8F0EC">{{r.d}}</span> <span style="color: #8A9A92; font-size: 11px">{{r.w}}</span>
<span style="display: inline-block; width: 5px; height: 5px; margin-left: 4px; vertical-align: middle; border-radius: 50%; background: {{r.dot}}; box-shadow: 0 0 6px {{r.dot}}"></span>
</th>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4">
<td style="padding: 9px 8px; text-align: right; color: {{c.c}}">{{c.t}}</td>
</sc-for>
<td style="padding: 9px 14px 9px 8px; text-align: right; color: #8A9A92">{{r.sum}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>

<p style="margin: 0; padding: 0 4px; font-size: 12px; line-height: 1.5; color: #8A9A92">
<span style="color: #F5B83D">●</span> open until 22:00 the day before · <span style="color: #22E07A">●</span> today · tap a cell to edit
</p>
</main>

<nav class="g" aria-label="Primary" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 6px 26px; border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; background: rgba(8,12,10,0.72)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.cur}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding-top: 4px; text-decoration: none; font-size: 11px; color: {{t.color}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
<span>{{t.label}}</span>
<span style="width: 4px; height: 4px; border-radius: 50%; background: {{t.dot}}; box-shadow: 0 0 8px {{t.dot}}"></span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  tabs(active) {
    const T = [
      ['Today', 'Main.dc.html', 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM9 16l2 2 4-4'],
      ['Meals', 'Phone-Meals.dc.html', 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z'],
      ['Bazar', 'Phone-Bazar.dc.html', 'M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0'],
      ['Report', 'Phone-Report.dc.html', 'M3 3v18h18M8 16v-4M13 16V8M18 16v-7'],
      ['More', 'Phone-Close.dc.html', 'M4 6h16M4 12h16M4 18h16']
    ];
    return T.map(([label, href, d]) => ({ label, href, d, cur: label === active ? 'page' : 'false', color: label === active ? '#22E07A' : '#8A9A92', dot: label === active ? '#22E07A' : 'transparent' }));
  }
  renderVals() {
    const data = [
      ['31', 'Sat', [2, 2, 1.5, 2]], ['30', 'Fri', [2, 2, 1, 2.5]], ['29', 'Thu', [1, 1.5, 1, 1]],
      ['28', 'Wed', [1, 1, 1, 1.5]], ['27', 'Tue', [0, 1, 1, 1]], ['26', 'Mon', [1, 1, 0, 1.5]],
      ['25', 'Sun', [1, 1.5, 1, 1]], ['24', 'Sat', [0, 0, 0, 0]], ['23', 'Fri', [1, 1, 1, 1.5]],
      ['22', 'Thu', [1, 1, 1, 1]], ['21', 'Wed', [0.5, 1, 1, 1]]
    ];
    const fmt = (n) => (n % 1 ? n.toFixed(1) : String(n));
    return {
      members: ['Ayman', 'Saad', 'Alif', 'Asif'].map((n, i) => ({ name: n, color: i === 0 ? '#22E07A' : '#E8F0EC' })),
      totals: ['23.5', '27', '22.5', '30.5'],
      rows: data.map(([d, w, vals]) => {
        const sum = vals.reduce((a, b) => a + b, 0);
        return {
          d, w,
          dot: d === '31' ? '#F5B83D' : d === '30' ? '#22E07A' : 'transparent',
          cells: vals.map((v) => ({ t: v ? fmt(v) : '·', c: v ? '#E8F0EC' : '#4E5B55' })),
          sum: sum ? fmt(sum) : '—'
        };
      }),
      tabs: this.tabs('Meals')
    };
  }
}
</script>
</body>
</html>
