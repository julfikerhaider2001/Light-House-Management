<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light House · Add bazar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050807}
a{color:#22E07A}a:hover{color:#5BF09E}
.g{background:rgba(255,255,255,0.04);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,0.08);box-shadow:inset 0 1px 0 rgba(255,255,255,0.10)}
.m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s cubic-bezier(.2,.8,.2,1)}
button:active{transform:scale(0.96)}
button:disabled{cursor:not-allowed;opacity:0.45}
input{font:inherit;color:#E8F0EC;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.10);border-radius:12px;height:44px;box-sizing:border-box;padding:0 12px;min-width:0}
input::placeholder{color:#6E7D76}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #22E07A;outline-offset:2px}
@media (prefers-reduced-transparency:reduce){.g{background:#0E1411;-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){.g{background:#0E1411;border-color:rgba(255,255,255,0.4)}input{border-color:rgba(255,255,255,0.4)}}
@media (prefers-reduced-motion:reduce){button,button:active{transition:none;transform:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #E8F0EC; background: radial-gradient(120% 45% at 50% -8%, rgba(34,224,122,0.11), rgba(34,224,122,0) 62%), #050807">

<div aria-hidden="true" style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 10px">
<span class="m" style="font-size: 11px; letter-spacing: 0.14em; color: #8A9A92">MEAL EXPENSE · OCT</span>
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; font-weight: 650">Bazar</span>
<span class="m" style="font-size: 15px">৳9,577</span>
</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.5)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="sheetTitle" style="position: absolute; left: 0; right: 0; top: 108px; bottom: 0; border-radius: 26px 26px 0 0; background: rgba(14,20,17,0.92); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); border-top: 1px solid rgba(255,255,255,0.14); box-shadow: 0 -20px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; padding: 8px 16px 0">
<div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.22); align-self: center; margin-bottom: 8px"></div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 id="sheetTitle" style="margin: 0; font-size: 20px; letter-spacing: -0.01em; font-weight: 650">New expense</h2>
<span class="m" style="font-size: 12px; color: #8A9A92">Fri 30 Oct 2026</span>
</div>
<a href="Main.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 6px; font-size: 15px; color: #8A9A92; text-decoration: none">Cancel</a>
</div>

<div role="radiogroup" aria-label="Expense type" style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
<button role="radio" aria-checked="{{k.checked}}" onClick="{{k.pick}}" class="m" style="height: 40px; border-radius: 10px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.color}}; font-size: 12px; letter-spacing: 0.1em">{{k.label}}</button>
</sc-for>
</div>

<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px">
<span id="paidBy" class="m" style="font-size: 11px; letter-spacing: 0.12em; color: #8A9A92">PAID BY</span>
<div role="radiogroup" aria-labelledby="paidBy" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{payers}}" as="p" hint-placeholder-count="4">
<button role="radio" aria-checked="{{p.checked}}" onClick="{{p.pick}}" style="height: 44px; border-radius: 12px; font-size: 14px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.color}}">{{p.name}}</button>
</sc-for>
</div>
</div>

<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between">
<span class="m" style="font-size: 11px; letter-spacing: 0.12em; color: #8A9A92">ITEMS</span>
<span class="m" style="font-size: 11px; color: #8A9A92">{{count}} rows</span>
</div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; gap: 8px; align-items: center">
<input aria-label="{{it.nameLabel}}" placeholder="Item, e.g. murgi" value="{{it.name}}" onChange="{{it.onName}}" style="flex: 1">
<div style="position: relative; width: 104px">
<span class="m" aria-hidden="true" style="position: absolute; left: 12px; top: 13px; font-size: 14px; color: #8A9A92">৳</span>
<input class="m" inputmode="decimal" aria-label="{{it.amtLabel}}" aria-invalid="{{it.invalid}}" placeholder="0" value="{{it.amount}}" onChange="{{it.onAmt}}" style="width: 104px; padding-left: 28px; text-align: right; border-color: {{it.border}}">
</div>
<button aria-label="{{it.removeLabel}}" onClick="{{it.remove}}" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #8A9A92; display: grid; place-items: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</button>
</div>
<sc-if value="{{it.invalidFlag}}" hint-placeholder-val="{{false}}">
<span role="alert" style="font-size: 12px; color: #FF5C5C; padding-left: 4px">Enter an amount above 0 for {{it.shown}}</span>
</sc-if>
</div>
</sc-for>
<button onClick="{{add}}" style="height: 44px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.18); background: transparent; color: #C9D6CF; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add item
</button>
</div>

<button style="margin-top: 12px; height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A9A92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15.5 12.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0z"></path></svg>
<span style="font-size: 14px">Receipt photo</span>
<span class="m" style="margin-left: auto; font-size: 11px; color: #8A9A92">optional · ≤300 KB</span>
</button>

<div style="margin-top: auto; padding: 14px 0 28px; display: flex; align-items: center; gap: 12px; border-top: 1px solid rgba(255,255,255,0.06)">
<div style="display: flex; flex-direction: column; gap: 2px">
<span class="m" style="font-size: 11px; letter-spacing: 0.12em; color: #8A9A92">TOTAL</span>
<span class="m" aria-live="polite" style="font-size: 24px; font-weight: 600">৳{{total}}</span>
</div>
<button disabled="{{blocked}}" style="margin-left: auto; height: 52px; padding: 0 22px; border-radius: 14px; border: 1px solid rgba(34,224,122,0.6); background: rgba(34,224,122,0.10); color: #22E07A; font-size: 15px; font-weight: 600; box-shadow: 0 0 24px rgba(34,224,122,0.20)">Save expense</button>
</div>

<sc-if value="{{hasUndo}}" hint-placeholder-val="{{false}}">
<div role="status" class="g" style="position: absolute; left: 16px; right: 16px; bottom: 106px; border-radius: 14px; background: rgba(28,36,32,0.94); display: flex; align-items: center; gap: 10px; padding: 0 6px 0 16px; height: 52px">
<span style="font-size: 14px">Removed {{undoName}}</span>
<button onClick="{{undo}}" style="margin-left: auto; height: 44px; padding: 0 14px; border: 0; background: transparent; color: #22E07A; font-size: 14px; font-weight: 600">Undo</button>
</div>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      kind: 'bazar', payer: 'Saad', undo: null, nextId: 4,
      items: [{ id: 1, name: 'murgi', amount: '230' }, { id: 2, name: 'chal+milk', amount: '90' }, { id: 3, name: 'peyaj', amount: '60' }]
    };
  }
  componentWillUnmount() { clearTimeout(this.undoT); }
  upd(id, key, val) {
    this.setState({ items: this.state.items.map((x) => (x.id === id ? Object.assign({}, x, { [key]: val }) : x)) });
  }
  remove(id) {
    const idx = this.state.items.findIndex((x) => x.id === id);
    const item = this.state.items[idx];
    this.setState({ items: this.state.items.filter((x) => x.id !== id), undo: { item, idx } });
    clearTimeout(this.undoT);
    this.undoT = setTimeout(() => this.setState({ undo: null }), 5000);
  }
  renderVals() {
    const s = this.state;
    const bad = (x) => (x.name.trim() !== '' || x.amount !== '') && !(parseFloat(x.amount) > 0);
    const total = s.items.reduce((a, x) => a + (parseFloat(x.amount) > 0 ? parseFloat(x.amount) : 0), 0);
    const pill = (on) => ({ border: on ? 'rgba(34,224,122,0.55)' : 'rgba(255,255,255,0.08)', bg: on ? 'rgba(34,224,122,0.10)' : 'transparent', color: on ? '#22E07A' : '#C9D6CF', checked: on ? 'true' : 'false' });
    return {
      kinds: [['bazar', 'BAZAR'], ['initial', 'INITIAL']].map(([k, label]) => Object.assign({ label, pick: () => this.setState({ kind: k }) }, pill(s.kind === k))),
      payers: ['Ayman', 'Saad', 'Alif', 'Asif'].map((n) => Object.assign({ name: n, pick: () => this.setState({ payer: n }) }, pill(s.payer === n))),
      count: s.items.length,
      items: s.items.map((x) => {
        const b = bad(x);
        const shown = x.name.trim() || 'this item';
        return {
          name: x.name, amount: x.amount, shown,
          nameLabel: 'Item name', amtLabel: 'Amount for ' + shown, removeLabel: 'Remove ' + shown,
          invalid: b ? 'true' : 'false', invalidFlag: b,
          border: b ? 'rgba(255,92,92,0.7)' : 'rgba(255,255,255,0.10)',
          onName: (e) => this.upd(x.id, 'name', e.target.value),
          onAmt: (e) => this.upd(x.id, 'amount', e.target.value.replace(/[^0-9.]/g, '')),
          remove: () => this.remove(x.id)
        };
      }),
      add: () => this.setState({ items: s.items.concat([{ id: s.nextId, name: '', amount: '' }]), nextId: s.nextId + 1 }),
      total: total.toLocaleString('en-IN', { maximumFractionDigits: 2 }),
      blocked: total <= 0 || s.items.some(bad),
      hasUndo: !!s.undo,
      undoName: s.undo ? (s.undo.item.name || 'item') : '',
      undo: () => {
        if (!s.undo) return;
        const items = s.items.slice();
        items.splice(s.undo.idx, 0, s.undo.item);
        clearTimeout(this.undoT);
        this.setState({ items, undo: null });
      }
    };
  }
}
</script>
</body>
</html>
